name: Release

# Pushing a tag like v1.2 builds the signed release APK and publishes it as a GitHub release, which installed
# apps then offer as an update. scripts/publish-release.sh creates and pushes the tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches versionName
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $version in app/build.gradle.kts"
            exit 1
          fi

      - name: Install the signing key
        # Release builds are signed with the debug key (see app/build.gradle.kts) so they update existing installs.
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::Secret SIGNING_KEYSTORE_BASE64 is missing"; exit 1; fi
          mkdir -p ~/.android
          echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore

      - name: Build
        run: ./gradlew :app:assembleRelease

      - name: Check the signing certificate
        # With a missing or different key, phones refuse the update; better to fail here than publish it.
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee certs.txt
          grep -q "SHA-256 digest: 8efa918e55899d97a7a47d7d7188e8c4da08b29d2ae38c0d5defc5214bc6e8c2" certs.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk="LynerrrFood-$version.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "LynerrrFood $version" --notes-from-tag
